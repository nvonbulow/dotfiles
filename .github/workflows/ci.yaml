name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git fish
      - name: Smoke isolated bootstrap
        run: bash tests/bootstrap.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke prerequisites
        run: |
          command -v git
          command -v fish >/dev/null || brew install fish
      - name: Smoke isolated bootstrap
        run: bash tests/bootstrap.sh
